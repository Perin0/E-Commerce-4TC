# Nome do App
spring.application.name=ecommerce4tc-back

#Url da conexão com o banco de dados
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo
#User
spring.datasource.username=sergio
#Senha
spring.datasource.password=123@Mudar
#Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Ativa criação das tabelas automaticamente
spring.jpa.hibernate.ddl-auto=create

#Exibe no console os comandos SQL gerados pelo Hibernate (JPA)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect